name: Release gates

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Audit repository completeness
        run: python scripts/audit_repository.py
      - name: Type-check
        run: npm run lint
      - name: Production build
        run: npm run build

  python:
    name: Python unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "./python[dev]"
      - name: Unit tests
        run: python -m pytest python/tests -q
      - name: Simulator CLI smoke test
        run: python -m cl1_neural_lab.cli --steps 3 --seed 7

  safety-boundary:
    name: Physical-device boundary tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e "./python[dev]"
      - name: Run sandbox guard tests
        run: python -m pytest sandbox/tests -q
      - name: Verify no physical device opt-in
        run: |
          if [ "${CL1_REAL_DEVICE:-0}" = "1" ]; then
            echo "Physical device access must not be enabled in CI."
            exit 1
          fi
