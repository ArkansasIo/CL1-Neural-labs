[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cl1-neural-lab"
version = "0.1.0"
description = "Cross-platform Python research simulator and plugin host for CL1 Neural Labs"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "See repository license status; no root license was found during setup." }
dependencies = []

[project.optional-dependencies]
server = ["aiohttp>=3.9,<4"]
science = ["numpy>=1.26", "scipy>=1.11", "pandas>=2.1"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[project.scripts]
cl1-neural-lab = "cl1_neural_lab.cli:main"
cl1-neural-lab-server = "cl1_neural_lab.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["cl1_neural_lab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"